name: Daily Portfolio Forecast

on:
  # Run weekdays at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1-5'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      forecaster:
        description: 'Forecaster to use'
        required: false
        default: 'xgboost'
        type: choice
        options:
          - xgboost
          - lightgbm
          - catboost
          - random_forest
          - ridge
          - lasso
          - elasticnet
          - hist_gradient_boosting
          - arima
          - theta
          - ets
          - naive
          - seasonal_naive
          - drift
          - garch
          - prophet

      allocator:
        description: 'Allocator to use'
        required: false
        default: 'robust_markowitz'
        type: choice
        options:
          - robust_markowitz
          - risk_parity
          - minimum_variance
          - equal_weight
          - inverse_volatility
          - maximum_diversification
          - markowitz
          - max_sharpe
          - black_litterman
          - hrp
          - cvar
          - kelly_criterion
          - mean_cvar
          - omega_ratio

      compare_allocators:
        description: 'Compare all allocators with best forecaster'
        required: false
        default: false
        type: boolean

      horizon:
        description: 'Forecast horizon in days (21 = ~1 month)'
        required: false
        default: '21'
        type: choice
        options:
          - '1'
          - '5'
          - '21'
          - '63'
          - '252'

env:
  PYTHON_VERSION: '3.12'

jobs:
  forecast:
    name: Run Daily Forecast
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine trigger type
        id: trigger
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "trigger_type=ad-hoc" >> $GITHUB_OUTPUT
            echo "🔧 AD-HOC RUN - Manual trigger by ${{ github.actor }}"
          else
            echo "trigger_type=scheduled" >> $GITHUB_OUTPUT
            echo "📅 SCHEDULED RUN - Automated daily forecast"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install --system .

      - name: Validate DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not configured. Results will be saved to local SQLite database."
            echo "To persist results to PostgreSQL, add DATABASE_URL to repository secrets."
          else
            echo "✓ DATABASE_URL is configured"
          fi

      - name: Run forecast and optimization
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRIGGER_TYPE: ${{ steps.trigger.outputs.trigger_type }}
        run: |
          FORECASTER="${{ github.event.inputs.forecaster || 'xgboost' }}"
          ALLOCATOR="${{ github.event.inputs.allocator || 'robust_markowitz' }}"
          HORIZON="${{ github.event.inputs.horizon || '21' }}"

          echo "=============================================="
          echo "🚀 PORTFOLIO FORECAST - ${TRIGGER_TYPE^^}"
          echo "=============================================="
          echo "Forecaster: $FORECASTER"
          echo "Allocator: $ALLOCATOR"
          echo "Horizon: $HORIZON days"
          echo "=============================================="

          uv run python -m src.main \
            --forecaster $FORECASTER \
            --allocator $ALLOCATOR \
            --horizon $HORIZON

      - name: Compare all allocators (if requested)
        if: github.event.inputs.compare_allocators == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=============================================="
          echo "📊 COMPARING ALL ALLOCATORS"
          echo "=============================================="

          uv run python -m src.main --mode comprehensive --horizon ${{ github.event.inputs.horizon || '21' }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-logs-${{ steps.trigger.outputs.trigger_type }}-${{ github.run_number }}
          path: |
            *.log
          retention-days: 7

  backtest:
    name: Weekly Model Comparison
    runs-on: ubuntu-latest
    # Run only on Mondays
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install --system .

      - name: Run model comparison backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Running weekly model comparison..."

          uv run python -m src.main --mode compare

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_number }}
          path: |
            *.log
            *.csv
          retention-days: 30

  # Notification on failure - creates GitHub issue for tracking
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [forecast]
    if: failure() && github.event_name == 'schedule'

    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            // Check if there's already an open issue for forecast failures
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'forecast-failure',
              per_page: 1
            });

            if (issues.data.length > 0) {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issues.data[0].number,
                body: `### Daily Forecast Failed Again\n\n- **Run:** [View logs](${run_url})\n- **Time:** ${new Date().toISOString()}`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner,
                repo,
                title: `🔴 Daily Forecast Pipeline Failed`,
                body: `## Daily Forecast Failure Report\n\nThe scheduled daily forecast pipeline has failed.\n\n### Details\n\n- **Workflow:** Daily Portfolio Forecast\n- **Run:** [View logs](${run_url})\n- **Time:** ${new Date().toISOString()}\n\n### Potential Causes\n\n- Data extraction failure (API issues)\n- Model training errors\n- Database connection problems\n- Configuration issues\n\n### Next Steps\n\n1. Check the [workflow logs](${run_url}) for error details\n2. Verify DATABASE_URL secret is configured\n3. Check if data sources are accessible\n4. Fix the issue and close this issue\n\n---\n*This issue was automatically created by the daily forecast workflow.*`,
                labels: ['forecast-failure', 'automated', 'priority-high']
              });
            }
