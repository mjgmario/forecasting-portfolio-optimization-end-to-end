# Fast Configuration
# Use for quick iterations and smoke tests.
# Minimal compute, fastest execution possible.

execution:
  mode: single
  save_to_db: false
  horizon: 1
  verbose: false

# Tiny portfolio
portfolio:
  tickers:
    - AAPL
    - MSFT

  risk:
    minimum_allocation: 0.1
    maximum_allocation: 1.0
    risk_aversion: 5

dates:
  start_date: "2024-06-01"  # Very short history
  end_date: null

forecasters:
  default: naive
  mode: single
  training_mode: individual

  skip:
    - nbeats
    - nhits
    - prophet
    - catboost
    - lightgbm
    - xgboost
    - random_forest
    - hist_gradient_boosting
    - garch
    - egarch
    - gjr_garch
    - arima
    - ets
    - theta

  configs:
    naive: {}
    drift: {}
    ridge:
      lags: 3
      windows: [5]
      alpha: 1.0

allocators:
  default: equal_weight

backtesting:
  initial_train_size: 20
  test_size: 1
  step_size: 20
  min_train_size: 10

database:
  mode: local
  table_name: stock_optimisation_fast

logging:
  level: WARNING
